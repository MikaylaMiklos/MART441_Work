<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Aquarium</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            background-color: rgb(2, 26, 76);
        }
        canvas {
            display: block;
            margin: 0 auto;
        }

    </style>
</head>
<body>

<script>

var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

var platforms;
var fish;
var seaweed;
var bubbles;
var cursors;

var normalSpeed = 100;
var boostSpeed = 220;   // brief fast swim
var currentSpeed = normalSpeed;
var boostDuration = 0;


var game = new Phaser.Game(config);

function preload ()
{
    this.load.image('sky', 'assets/gradient25.png');
    this.load.image('ground', 'assets/platform.png');
    this.load.image('seaweed', 'assets/seaweed.png');
    this.load.image('bubbles', 'assets/aqua_ball.png');
    this.load.audio('pop', 'audio/soundreality-pop-423717.mp3');  
    this.load.audio('bgm', 'audio/musicword-bubbles-309433.mp3');  
    this.load.spritesheet('fish', 'assets/fish.png', {
        frameWidth: 16,frameHeight: 18 });
}

function create ()
{
    this.add.image(400, 300, 'sky');

    //music 
    this.backgroundMusic = () => {
    let music = this.sound.add('bgm');
    music.play({ loop: true });
    };

    this.backgroundMusic();



    //create seaweed and ground
    seaweed = this.physics.add.staticGroup();
    //left side
    seaweed.create(200, 510, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(150, 475, 'seaweed');
    seaweed.create(100, 510, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(50, 475, 'seaweed');
    seaweed.create(300, 525, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(250, 500, 'seaweed');

    //right side
    seaweed.create(700, 510, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(750, 475, 'seaweed');
    seaweed.create(610, 500, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(650, 475, 'seaweed');
    seaweed.create(520, 525, 'seaweed').setScale(.85).refreshBody();
    seaweed.create(560, 500, 'seaweed');

    platforms = this.physics.add.staticGroup();
    platforms.create(400, 568, 'ground').setScale(2).refreshBody();

    //create fishes
    fish = this.physics.add.sprite(780, 370, 'fish');
    fish2 = this.physics.add.sprite(20, 250, 'fish');
    fish3 = this.physics.add.sprite(300, 150, 'fish');

    //  fish physics properties. 
    fish.setCollideWorldBounds(true);
    fish.body.allowGravity = false;
    fish.setVelocityX(100);

    fish2.setCollideWorldBounds(true);
    fish2.body.allowGravity = false;
    fish2.setVelocityX(100);

    fish3.setCollideWorldBounds(true);
    fish3.body.allowGravity = false;
    fish3.setVelocityX(-100);


    // fish animations
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('fish', { start: 0, end: 1 }),
        frameRate: 10,
        repeat: -1
    });

        this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('fish', { start: 2, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    fish.direction = 1;   // moving right
    fish2.direction = 1;
    fish3.direction = -1; // moving left


    //end fish 

    // create bubbles
    bubbles = this.physics.add.group({
        key: 'bubbles',
        repeat: 11,
        setXY: { x: 12, y: 480, stepX: 70 }
    });

    // bubble physics
    bubbles.children.iterate(function (child) {
        child.setBounce(1);
        child.setCollideWorldBounds(true);
        child.setVelocity(Phaser.Math.Between(-100, 100), Phaser.Math.Between(-50, 50));
        child.body.allowGravity = false;
    });



     //  Input Events
    cursors = this.input.keyboard.createCursorKeys();

    this.physics.add.collider(bubbles, platforms);


    randomBubbleSpawn();
    this.time.addEvent({
        delay: 1000,
        callback: randomBubbleSpawn,
        callbackScope: this,
        loop: true
    });

}

function update () 
{

        //pressing space clears all bubbles
    if (Phaser.Input.Keyboard.JustDown(cursors.space)) {
        bubbles.clear(true, true);

        let music = this.sound.add('pop');
        music.play();

        // Trigger boost
        currentSpeed = boostSpeed;
        boostDuration = 40; // frames (~0.6 sec)
    }
    // Apply currentSpeed every frame
    applyFishSpeed(fish);
    applyFishSpeed(fish2);
    applyFishSpeed(fish3);

    function applyFishSpeed(f) {
        f.setVelocityX(f.direction * currentSpeed);
    }



    // Handle boost duration
    if (boostDuration > 0) {
        boostDuration--;
        if (boostDuration === 0) {
            currentSpeed = normalSpeed; // reset to normal speed
        }
    }

}


function randomBubbleSpawn() {
    var x = Phaser.Math.Between(0, 800);
    var bubble = bubbles.create(x, 525, 'bubbles');

    bubble.setBounce(1);
    bubble.setCollideWorldBounds(true);
    bubble.setVelocity(Phaser.Math.Between(-100, 100), Phaser.Math.Between(-50, -200));
    bubble.body.allowGravity = false;
    
    fishSwim();
}

function fishSwim() {
    // fish 1
    if (fish.x >= 780) {
        fish.direction = -1;
        fish.anims.play('left', true);
    } else if (fish.x <= 20) {
        fish.direction = 1;
        fish.anims.play('right', true);
    }

    // fish 2
    if (fish2.x >= 780) {
        fish2.direction = -1;
        fish2.anims.play('left', true);
    } else if (fish2.x <= 20) {
        fish2.direction = 1;
        fish2.anims.play('right', true);
    }

    // fish 3
    if (fish3.x >= 780) {
        fish3.direction = -1;
        fish3.anims.play('left', true);
    } else if (fish3.x <= 20) {
        fish3.direction = 1;
        fish3.anims.play('right', true);
    }
}



</script>

</body>
</html>
